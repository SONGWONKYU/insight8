<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data: blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>인사이트8 · 잠금 해제</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#14241b;background:#f2f3f0}*{box-sizing:border-box}body{margin:0}main{min-height:100svh;display:grid;place-items:center;padding:28px}.card{width:min(450px,100%);padding:42px 36px;background:#fff;border:1px solid #e1e6df;border-radius:28px;box-shadow:0 16px 70px #173a1e08}.logo{width:48px;height:48px;background:#d3ef88;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:24px}.eyebrow{font-size:11px;color:#64736b;letter-spacing:.13em;margin:28px 0 10px}h1{font-size:31px;letter-spacing:-.06em;margin:0 0 14px}p{color:#647366;font-size:14px;line-height:1.8;margin:0 0 25px}label{display:block;font-size:13px;font-weight:650;margin-bottom:9px}input{width:100%;font:inherit;padding:15px 16px;border:1px solid #cbd5c9;border-radius:12px;background:#fafcf8;color:#14241b}input:focus{outline:3px solid #d3ef8880;outline-offset:2px;border-color:#779761}button{width:100%;border:0;background:#163d29;color:white;font:inherit;font-weight:650;padding:16px;margin-top:14px;border-radius:13px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.fine{font-size:12px;border-top:1px solid #e8ece5;padding-top:20px;margin-top:26px;color:#77877b}.message{font-size:13px;color:#a33c28;min-height:20px;line-height:1.7;margin-top:12px}.schedule{display:flex;justify-content:space-between;gap:10px;color:#667969;font-size:12px;margin-top:8px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f2f3f0}body.unlocked main{display:none}.lock{position:fixed;right:20px;bottom:100px;z-index:99999;width:auto;box-shadow:0 4px 20px #14241b30;padding:10px 16px;font-size:12px;margin:0;background:#163d29ee}.hidden{display:none!important}@media(max-width:500px){.card{padding:34px 26px}.lock{right:12px;bottom:90px}}
</style>
</head>
<body>
<main id="gate"><section class="card"><div class="logo">i8</div><div class="eyebrow">UNIVERA · AGENCY INSIGHTS</div><h1>대리점 인사이트</h1><p>공유받은 암호를 입력하면<br>대리점 현황과 분석 자료를 열 수 있습니다.</p><form id="unlockForm"><label for="password">접속 암호</label><input id="password" type="password" autocomplete="current-password" required aria-describedby="message"><button id="unlockButton" type="submit">인사이트8 열기</button><div id="message" class="message" role="status" aria-live="polite"></div></form><div class="fine">자료는 이 브라우저에서 암호를 해제한 뒤 표시됩니다.<div class="schedule"><span>자동 갱신 예약</span><span>매일 오전 8:45 · 한국시간</span></div></div></section></main>
<button id="lockButton" class="lock hidden" type="button">화면 잠그기</button>
<script type="module" src="./app.mjs"></script>
</body></html>
